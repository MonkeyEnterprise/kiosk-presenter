# Template for /etc/cloudflared/config.yml; setup.sh fills in the __PLACEHOLDERS__
tunnel: "__TUNNEL_ID__"
credentials-file: "__CREDENTIALS_FILE__"
origincert: /root/.cloudflared/cert.pem
ingress:
  - hostname: "__HOSTNAME__"
    service: ssh://localhost:22
  - hostname: "*"
    service: http_status:404
