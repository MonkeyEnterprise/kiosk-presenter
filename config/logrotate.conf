# Log rotation for the kiosk logs, installed as /etc/logrotate.d/kiosk-presenter
# by setup.sh and migrate.sh. __LOGS__, __USER__ and __GROUP__ are replaced
# with the log directory (/var/log/kiosk-presenter) and the kiosk user and
# group, who own it.
#
# Rotates weekly, or as soon as a log is larger than 5 MB (logrotate runs
# daily), and keeps 4 compressed old logs. copytruncate, so the scripts can
# keep writing to the same file.
__LOGS__/*.log {
    su __USER__ __GROUP__
    weekly
    maxsize 5M
    rotate 4
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
